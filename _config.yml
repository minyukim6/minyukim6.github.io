# Site settings
title: "Minyu Kim"
description: "Personal academic profile and resume for Minyu Kim."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Minyu Kim"
resume_title:                   "Computer Science Student"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "minyu12@snu.ac.kr"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "+82-10-8008-3212"
resume_contact_address:         "Seoul, South Korea"

resume_header_contact_info:     "Seoul, South Korea &bull; minyu12@snu.ac.kr"
display_header_contact_info:    "true"

resume_header_intro: "<p>I am a Computer Science undergraduate at Seoul National University interested in algorithms, data analysis, and systems. My background includes competitive programming, research-oriented academic programs, and projects in heuristic optimization and applied computing.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           false
resume_section_associations:    false
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/minyukim6"
  # resume_twitter_url:           "insert Twitter URL here"
  # resume_dribbble_url:          "insert Dribbble URL here"
  # resume_facebook_url:          "insert Facebook URL here"
  # resume_linkedin_url:          "insert LinkedIn URL here"
  # resume_instagram_url:         "insert your Instagram URL here"
  # resume_website_url:           "insert Website URL here"
  # resume_medium_url:            "insert Medium URL here"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
